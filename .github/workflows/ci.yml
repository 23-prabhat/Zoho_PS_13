name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHIKAI_USE_LOCAL_GPU: "0"
    steps:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://github.com/actions/setup-python/releases/tag/v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install native SDK system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ocl-icd-libopencl1
      - name: Install native build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements/build.lock.txt
          .venv/bin/python -m pip check
      - name: Check script syntax and reporting regressions
        shell: bash
        run: |
          .venv/bin/python -m compileall -q scripts tests
          for file in scripts/*.sh scripts/shikai tests/*.sh; do bash -n "$file"; done
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
          git diff --check
      - name: Install checksum-pinned OpenVINO GenAI SDK
        run: ./scripts/setup_cpp_runtime.sh
      - name: Build native application
        run: ./scripts/build_cpp.sh
      - name: Run model-free native and CLI tests
        run: .venv/bin/ctest --preset release -L unit
      - name: Confirm model-free device discovery
        run: ./scripts/shikai devices
